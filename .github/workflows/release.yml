# RDPNO's check on GitHub: does it build, do the host tests pass. WITHOUT Roland's ROMs: they never go to GitHub
# (tools/pack_roms.py --no-roms makes blank ROMs of the right sizes; the firmware built so only says "NO ROMS: BUILD
# IT YOURSELF"). Nothing is uploaded: whoever wants RDPNO builds it with the ROMs on their own computer
# (tools/setup.sh, README.md "Build it yourself"). Runs on every push and pull request, and by hand.
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com, as in
# Dinghy's, sloopDX's and OberVave's workflows.
name: check

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RDP_NO_ROMS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      # The three files of the SDK the package needs, kept between runs: gitee.com drops clones now and then
      # (a run failed so, 2026-11-06), and with them cached it is asked only once. build.py checks their SHA-256.
      - name: JieLi AC79 SDK, from the cache
        id: sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/cfg_tool.bin
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/cfg/eq_cfg_hw.bin
          key: ac79-sdk-AC79NN_SDK_V1.2.1_2023-12-13

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4 5; do                 # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep $((30 * i))
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build, no ROMs (the three sets compile and link; the SMK-37 first, the FM-1 last, as the tests expect)
        run: |
          sh build.sh --set mk80
          sh build.sh --set mks20b
          sh build.sh --romtest                  # (the ROM area test: the small app slot fits)
          sh build.sh --romload                  # (the ROMs from the load page)
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh

      - name: Host tests (the ones that need the ROMs' sound are skipped)
        run: sh tests/run_tests.sh
