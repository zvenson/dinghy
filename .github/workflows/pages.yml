# RDPNO's site on GitHub Pages (Settings > Pages > Source: GitHub Actions): the web installer, the ROM load page, the
# screens, and the ROM-free firmware (tools/build.py --romload --release $(cat VERSION): no Roland data in it; the
# player loads their own ROMs from the load page). Built from main when the firmware, the site or VERSION change, and
# by hand. The toolchain and the SDK as in release.yml (the check).
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firmware/**', 'site/**', 'tools/**', 'VERSION', '.github/workflows/pages.yml']

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RDP_NO_ROMS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK, from the cache
        id: sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/cfg_tool.bin
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/cfg/eq_cfg_hw.bin
          key: ac79-sdk-AC79NN_SDK_V1.2.1_2023-12-13

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep $((30 * i))
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: The ROM-free firmware and the site
        run: |
          sh build.sh --romload --release "$(cat VERSION)"
          python3 tools/make_site.py "build/rdpno-$(cat VERSION).fwsc" "$(cat VERSION)" build/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - id: deploy
        uses: actions/deploy-pages@v4
